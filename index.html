    <!-- Inline critical CSS to prevent FOUC -->
    <style>
      /* Loading screen styles */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loading-text {
        margin-top: 20px;
        color: #6b7280;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
      
      /* Prevent layout shift */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Safe area insets for notched devices */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>

  <body>
    <!-- Loading Screen -->
    <div id="app-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Plot Yangu...</div>
    </div>
    
    <!-- App Root -->
    <div id="root"></div>
    
    <!-- Preload sql.js WASM -->
    <script>
      // Preload sql.js WASM for faster startup
      if (typeof window !== 'undefined' && !window.location.protocol.startsWith('capacitor')) {
        fetch('https://sql.js.org/dist/sql-wasm.wasm', { 
          mode: 'cors',
          cache: 'force-cache'
        }).catch(err => {
          console.warn('sql.js WASM preload failed:', err);
        });
      }
    </script>
    
    <!-- Service Worker Registration -->
    <script>
      // Register service worker early (before React loads)
      if ('serviceWorker' in navigator && !window.location.protocol.startsWith('capacitor')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(registration => {
              console.log('✅ Service Worker registered:', registration.scope);
              
              // Check for updates on page load
              registration.update();
            })
            .catch(error => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- PWA Install Detection -->
    <script>
      // Detect PWA install prompt
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Notify app that install is available
        window.dispatchEvent(new CustomEvent('pwa-installable'));
        
        console.log('💾 PWA install prompt available');
      });
      
      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        console.log('✅ PWA installed successfully');
      });
      
      // Make install prompt available globally
      window.showInstallPrompt = async function() {
        if (!deferredPrompt) {
          console.log('⚠️ Install prompt not available');
          return false;
        }
        
        try {
          await deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`User ${outcome} the install prompt`);
          deferredPrompt = null;
          return outcome === 'accepted';
        } catch (error) {
          console.error('Install prompt error:', error);
          return false;
        }
      };
    </script>
    
    <!-- Storage Persistence Detection -->
    <script>
      // Request persistent storage on load
      if ('storage' in navigator && 'persist' in navigator.storage) {
        navigator.storage.persist().then(granted => {
          if (granted) {
            console.log('✅ Persistent storage granted');
          } else {
            console.log('⚠️ Persistent storage denied');
          }
        });
      }
      
      // Monitor storage usage
      if ('storage' in navigator && 'estimate' in navigator.storage) {
        navigator.storage.estimate().then(estimate => {
          const usage = estimate.usage || 0;
          const quota = estimate.quota || 0;
          const percentUsed = (usage / quota * 100).toFixed(2);
          
          console.log('📊 Storage:', {
            used: `${(usage / 1024 / 1024).toFixed(2)} MB`,
            quota: `${(quota / 1024 / 1024).toFixed(2)} MB`,
            percent: `${percentUsed}%`
          });
          
          // Warn if storage is getting full (> 80%)
          if (percentUsed > 80) {
            console.warn('⚠️ Storage is getting full!');
          }
        });
      }
    </script>
    
    <!-- Main App -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide loading screen after app loads -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        // Give React time to render
        setTimeout(() => {
          const loading = document.getElementById('app-loading');
          if (loading) {
            loading.classList.add('hidden');
            setTimeout(() => loading.remove(), 300);
          }
        }, 1000);
      });
    </script>
    
    <!-- Offline Detection -->
    <script>
      // Monitor online/offline status
      window.addEventListener('online', () => {
        console.log('🌐 Back online');
        window.dispatchEvent(new CustomEvent('connection-restored'));
      });
      
      window.addEventListener('offline', () => {
        console.log('📡 Offline mode');
        window.dispatchEvent(new CustomEvent('connection-lost'));
      });
      
      // Log initial status
      console.log(navigator.onLine ? '🌐 Online' : '📡 Offline');
    </script>
  </body>
